        /* Typing Cursor */
        .cursor::after {

        @keyframes blink { 50% { opacity: 0; } }
        
        /* Parallax Background */
        .parallax-bg {

        }
        .parallax-overlay {

                { icon: "fab fa-linkedin", url: "https://www.linkedin.com/in/iqbal-hossain-9498a03a0?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app", color: "text-gray-400 hover:text-[#0a66c2]" },
                { icon: "fab fa-youtube", url: "https://www.youtube.com/@Aiparkk", color: "text-gray-400 hover:text-[#ff0000]" }
            ],
            projects: [
                {
                    title: "Premium Corporate Website",
                    image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=2015&auto=format&fit=crop",
                    liveLink: "#",
                    githubLink: "#"
                },
                {
                    title: "Animal Family Content Hub",
                    image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2000&auto=format&fit=crop",
                    liveLink: "#",

                },
                {

                    image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=2070&auto=format&fit=crop",

                telegramBotToken: "8867329148:AAFx7TokKq1Gv3hTC9UT93vOFSHhvp2qNoE",
                telegramChatId: "7407039080",
                googleSheetScriptUrl: "YOUR_GOOGLE_SCRIPT_URL_HERE"
            }
        };

        /* ====================================================================
           CORE LOGIC & DOM POPULATION (Do not change unless adding structure)
           ==================================================================== */
        
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize AOS Animation
            AOS.init({ once: true, offset: 100, duration: 800 });

            // Populate Personal Info
            document.getElementById('nav-name').innerText = portfolioData.personal.name;
            document.getElementById('hero-name').innerText = portfolioData.personal.name;
            document.getElementById('hero-img').src = portfolioData.personal.profileImage;
            document.getElementById('about-text').innerText = portfolioData.personal.aboutMe;
            document.getElementById('info-email').innerText = portfolioData.personal.email;
            document.getElementById('info-phone').innerText = portfolioData.personal.phone;
            document.getElementById('info-location').innerText = portfolioData.personal.location;
            document.getElementById('footer-name').innerText = portfolioData.personal.name;
            document.getElementById('current-year').innerText = new Date().getFullYear();

            // Populate Social Links
            const socialHero = document.getElementById('social-links-hero');
            portfolioData.socialLinks.forEach(link => {
                socialHero.innerHTML += `<a href="${link.url}" target="_blank" class="${link.color} transition transform hover:scale-110"><i class="${link.icon}"></i></a>`;
            });

            // Populate Skills
            const skillsContainer = document.getElementById('skills-container');
            portfolioData.skills.forEach((skill, index) => {
                skillsContainer.innerHTML += `

                        <span class="text-white font-semibold">${skill.name}</span>
                    </div>
                `;
            });

            // Populate Portfolio Projects (With Top-to-Bottom Hover Effect)
            const portfolioGrid = document.getElementById('portfolio-grid');
            portfolioData.projects.forEach((proj, index) => {
                portfolioGrid.innerHTML += `
                    <div class="glass-card rounded-2xl overflow-hidden group border border-white/10" data-aos="fade-up" data-aos-delay="${index * 150}">
                        <div class="h-72 w-full bg-cover bg-top transition-all duration-[3000ms] ease-in-out group-hover:bg-bottom relative border-b border-white/10" style="background-image: url('${proj.image}')">

                                <i class="fas fa-link text-white text-3xl opacity-50"></i>
                            </div>
                        </div>
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-white mb-5">${proj.title}</h3>
                            <div class="flex gap-3">
                                <a href="${proj.liveLink}" target="_blank" class="flex-1 bg-primary text-white text-center py-2.5 rounded-lg hover:bg-blue-600 transition shadow-[0_0_15px_rgba(58,134,255,0.4)] font-semibold text-sm uppercase tracking-wide">

                                </a>
                                <a href="${proj.githubLink}" target="_blank" class="bg-slate-800 text-white px-5 py-2.5 rounded-lg hover:bg-slate-700 transition flex items-center justify-center">
                                    <i class="fab fa-github text-lg"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Populate Google Map
            const mapContainer = document.getElementById('map-container');
            mapContainer.innerHTML = `<iframe src="${portfolioData.apiConfig.googleMapEmbedUrl}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;

            // Typing Effect Logic
            const typedTextElement = document.getElementById('typed-text');
            const texts = portfolioData.personal.typingTexts;
            let textIndex = 0;
            let charIndex = 0;
            let isDeleting = false;

            function typeWriter() {
                const currentText = texts[textIndex];
                
                if (isDeleting) {
                    typedTextElement.innerText = currentText.substring(0, charIndex - 1);
                    charIndex--;
                } else {
                    typedTextElement.innerText = currentText.substring(0, charIndex + 1);
                    charIndex++;
                }

                let speed = isDeleting ? 50 : 100;

                if (!isDeleting && charIndex === currentText.length) {
                    speed = 2000; // Pause at end
                    isDeleting = true;
                } else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    textIndex = (textIndex + 1) % texts.length;
                    speed = 500; // Pause before new text
                }

                setTimeout(typeWriter, speed);
            }
            setTimeout(typeWriter, 1000);

            // Mobile Menu Toggle
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            btn.addEventListener('click', () => menu.classList.toggle('hidden'));
            menu.addEventListener('click', () => menu.classList.add('hidden'));
        });

        // Form Submit Handler (Telegram Integration)
        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('form-status');
            
            const data = {
                name: document.getElementById('form-name').value,
                phone: document.getElementById('form-phone').value,
                email: document.getElementById('form-email').value,
                message: document.getElementById('form-message').value
            };

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            // Telegram API Request Setup
            const botToken = portfolioData.apiConfig.telegramBotToken;
            const chatId = portfolioData.apiConfig.telegramChatId;
            const tgMsg = `🔔 <b>New Contact Request</b>%0A%0A👤 <b>Name:</b> ${data.name}%0A📱 <b>Phone:</b> ${data.phone}%0A📧 <b>Email:</b> ${data.email}%0A💬 <b>Message:</b> ${data.message}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${tgMsg}&parse_mode=HTML`);
                
                if (response.ok) {
                    // Success UI
                    btn.innerHTML = 'Sent Successfully <i class="fas fa-check ml-2"></i>';
                    btn.classList.replace('from-primary', 'from-green-500');
                    btn.classList.replace('to-[#00f2fe]', 'to-green-400');
                    
                    status.innerText = "Thanks for reaching out! I'll get back to you soon.";
                    status.classList.remove('hidden', 'text-red-400');
                    status.classList.add('text-green-400');
                    
                    document.getElementById('contact-form').reset();
                } else {
                    throw new Error('Telegram API responded with an error');
                }
            } catch (error) {
                console.error("Submission Error: ", error);
                // Error UI
                btn.innerHTML = 'Error! Try Again <i class="fas fa-times ml-2"></i>';
                btn.classList.replace('from-primary', 'from-red-500');
                btn.classList.replace('to-[#00f2fe]', 'to-red-400');
                
                status.innerText = "Sorry, something went wrong. Please try again.";
                status.classList.remove('hidden', 'text-green-400');
                status.classList.add('text-red-400');
            } finally {
                // Reset Button After 4 Seconds
                setTimeout(() => {
                    btn.innerHTML = 'Send Message <i class="fas fa-paper-plane ml-2"></i>';
                    btn.classList.remove('from-green-500', 'from-red-500', 'to-green-400', 'to-red-400');
                    btn.classList.add('from-primary', 'to-[#00f2fe]');
                    btn.disabled = false;
                    status.classList.add('hidden');
                }, 4000);
            }
        }
    </script>
</body>
